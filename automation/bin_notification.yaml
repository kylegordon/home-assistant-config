alias: 'Bin notification'
id: bin_notification
# Collections are on Mondays; remind on Sunday evening with the next bin
triggers:
  - trigger: time
    at: '17:00:00'
    weekday:
      - sun
actions:
  - action: persistent_notification.create
    data:
      message: "Next bin: {{ state_attr('calendar.bin_collection_schedule_bins', 'message') }}."
      title: "Bin Reminder"
