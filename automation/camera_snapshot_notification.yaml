---
alias: Camera Snapshot Notification
id: camera_snapshot_notification
# Frigate can emit multiple 'new' events in quick succession (e.g. several
# cameras detecting at once); default single-run mode was dropping the
# overlapping runs with an "Already running" warning instead of notifying.
mode: queued
max: 10
trigger:
  - platform: mqtt
    topic: "frigate/events"
variables:
  camera: "{{ trigger.payload_json.after.camera | default('unknown') }}"
  label: "{{ trigger.payload_json.after.label | default('object') }}"
  snapshot_entity: "camera.{{ camera }}_last_{{ label }}"
  # Repeated detections of the same camera+label within this window reuse
  # the same Android notification (updated message/image) instead of
  # stacking near-identical alerts. A gap longer than this raises a fresh,
  # separately-alerting notification instead of silently updating a
  # possibly already-dismissed one.
  notification_reuse_window_minutes: 15
  notification_tag: >-
    camera_snapshot_{{ camera }}_{{ label }}_{{ (as_timestamp(now()) // (notification_reuse_window_minutes * 60)) | int }}
condition:
  - "{{ trigger.payload_json.type == 'end' }}"
action:
  - service: notify.mobile_app_nothing_phone_2
    data:
      title: "{{ camera | replace('_', ' ') | title }} Snapshot"
      message: >
        {{ label | title }}
        detected on {{ camera | replace('_', ' ') | title }}
      data:
        tag: "{{ notification_tag }}"
        clickAction: "/lovelace/outside"
        url: "/lovelace/outside"
        image: >
          {% if states(snapshot_entity) not in ['unknown', 'unavailable'] %}
            /api/camera_proxy/{{ snapshot_entity }}?token={{ state_attr(snapshot_entity, 'access_token') }}
          {% endif %}
