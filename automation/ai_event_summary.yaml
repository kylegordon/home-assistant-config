alias: AI Event Summary
id: ai_event_summary
description: ''
use_blueprint:
  path: valentinfrlch/event_summary.yaml
  input:
    # LLM Vision "Anthropic Claude" provider entry
    provider: 01M1GN8ECBZ3K39355V6KVME4B
    model: ''
    # The blueprint pairs motion_sensors[i] with camera_entities[i]; keep the
    # two lists in the same order
    camera_entities:
      - camera.back_door
      - camera.driveway_tin_hut
      - camera.driveway
    motion_sensors:
      - binary_sensor.back_door_motion
      - binary_sensor.driveway_tin_hut_motion
      - binary_sensor.driveway_motion
    # Kyle's Nothing Phone 2 (mobile_app device)
    notify_device:
      - 6d07b4e762f3081db92dcee2bb03dc1e
    # Notify once, after the summary. Dynamic mode pre-notifies with a
    # snapshot that every listed camera writes to the same file, so it often
    # shows the wrong camera
    notification_delivery: Consolidated
    # Don't push summaries that found nothing
    condition_notify:
      - condition: template
        value_template: >-
          {{ response is defined
             and 'no activity observed' not in response.response_text | lower }}
    run_conditions: []
