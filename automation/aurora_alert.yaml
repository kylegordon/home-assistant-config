---
alias: Aurora Alert
id: aurora_alert
# The threshold lives in the Aurora integration's options (default 75%)
triggers:
  - trigger: state
    entity_id: binary_sensor.aurora_visibility_alert
    from: "off"
    to: "on"
actions:
  - action: notify.alexa_media_everywhere
    data:
      message: "Alert! The Aurora Borealis might be visible right now!"
      data:
        type: announce
        # method: all
  - action: notify.mobile_app_nothing_phone_2
    data:
      title: "Aurora Alert"
      message: "Alert! The Aurora Borealis might be visible right now!"
