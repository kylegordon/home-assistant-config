alias: "Home late night"
id: home_late_night
triggers:
  - trigger: state
    entity_id: binary_sensor.home_occupied
    from: "off"
    to: "on"
conditions:
  - condition: state
    entity_id: sun.sun
    state: "below_horizon"
  - condition: time
    after: '22:00:00'
    before: '05:00:00'
  - condition: not
    conditions:
      - condition: state
        entity_id:
          - sensor.kyle_status
          - sensor.charlotte_status
        state: "Sleeping"
        match: any
actions:
  - action: logbook.log
    data:
      name: EVENT
      message: "Home late..."
  - action: light.turn_on
    data:
      entity_id: light.hall
      brightness_pct: >
        {% if states('sensor.time_of_day') == "Morning" %}
        100
        {% elif states('sensor.time_of_day') == "Day" %}
        100
        {% elif states('sensor.time_of_day') == "Night" %}
        30
        {% else %}
        30
        {% endif %}
      transition: >
        {% if states('sensor.time_of_day') == "Morning" %}
        {{ 10.0 }}
        {% elif states('sensor.time_of_day') == "Day" %}
        {{ 2.0 }}
        {% elif states('sensor.time_of_day') == "Night" %}
        {{ 5.0 }}
        {% else %}
        {{ 5.0 }}
        {% endif %}
      color_temp_kelvin: >
        {% if states('sensor.time_of_day') == "Morning" %}
        5000
        {% elif states('sensor.time_of_day') == "Day" %}
        3333
        {% elif states('sensor.time_of_day') == "Night" %}
        2667
        {% else %}
        2667
        {% endif %}
  - action: light.turn_on
    data:
      entity_id: light.bedside_lights
  - action: light.turn_on
    data:
      entity_id: light.outside_lights

  - delay:
      minutes: 5
  - action: light.turn_off
    data:
      entity_id: light.outside_lights
