---
# Sourced from https://github.com/mconway/homeassistant-config/blob/master/packages/snmp_bandwidth.yaml
# and https://community.home-assistant.io/t/snmp-bandwidth-monitor/7122/37

homeassistant:
  customize:
    sensor.download_speed_mean:
      friendly_name: 'SNMP Download Average'
      icon: mdi:speedometer
    sensor.upload_speed_mean:
      friendly_name: 'SNMP Upload Average'
      icon: mdi:speedometer
    sensor.ping_time_mean:
      friendly_name: 'SNMP Ping Average'
      icon: mdi:clock-fast
    sensor.wan_traffic_in_mean:
      friendly_name: 'WAN Download Average'
      icon: mdi:download
    sensor.wan_traffic_out_mean:
      friendly_name: 'WAN Upload Average'
      icon: mdi:upload

template:
  - sensor:
      - name: 'Internet Speed IN'
        unique_id: internet_speed_in
        default_entity_id: sensor.internet_speed_in
        state: "{{ (states('input_number.internet_traffic_delta_in') | float(0) / 1000000) | round(2) }}"
        unit_of_measurement: 'Mbit/s'
      - name: 'Internet Speed OUT'
        unique_id: internet_speed_out
        default_entity_id: sensor.internet_speed_out
        state: "{{ (states('input_number.internet_traffic_delta_out') | float(0) / 1000000) | round(2) }}"
        unit_of_measurement: 'Mbit/s'

sensor:
  - platform: snmp
    name: snmp_wan_in
    host: 172.24.32.1
    community: !secret snmp_community
    baseoid: 1.3.6.1.2.1.2.2.1.10.2

  - platform: snmp
    name: snmp_wan_out
    host: 172.24.32.1
    community: !secret snmp_community
    baseoid: 1.3.6.1.2.1.2.2.1.16.2

  - platform: statistics
    name: 'WAN Traffic In'
    state_characteristic: mean
    entity_id: sensor.internet_speed_in
    sampling_size: 50

  - platform: statistics
    name: 'WAN Traffic Out'
    state_characteristic: mean
    entity_id: sensor.internet_speed_out
    sampling_size: 50

input_number:
  internet_traffic_delta_in:
    name: "Traffic IN Delta"
    initial: 0
    min: 0
    max: 1000000000000

  internet_traffic_delta_out:
    name: "Traffic OUT Delta"
    initial: 0
    min: 0
    max: 1000000000000

automation:
  - id: snmp_monitor_traffic_in
    alias: Monitor Traffic In
    trigger:
      platform: state
      entity_id: sensor.snmp_wan_in
    action:
      - service: input_number.set_value
        data:
          entity_id: input_number.internet_traffic_delta_in
          # The SNMP counter resets/wraps on device reboot, which can make
          # to_state < from_state and produce a negative delta. Clamp at 0
          # rather than erroring against the input_number's min.
          value: '{{ [ ((trigger.to_state.state | int - trigger.from_state.state | int) * 8 ) / ( as_timestamp(trigger.to_state.last_updated) - as_timestamp(trigger.from_state.last_updated) ), 0 ] | max }}'

  - id: snmp_monitor_traffic_out
    alias: Monitor Traffic Out
    trigger:
      platform: state
      entity_id: sensor.snmp_wan_out
    action:
      - service: input_number.set_value
        data:
          entity_id: input_number.internet_traffic_delta_out
          # See snmp_monitor_traffic_in: clamp negative deltas from counter
          # resets/wraps instead of erroring against the input_number's min.
          value: '{{ [ ((trigger.to_state.state | int - trigger.from_state.state | int) * 8 ) / ( as_timestamp(trigger.to_state.last_updated) - as_timestamp(trigger.from_state.last_updated) ), 0 ] | max }}'

group:
  snmp_monitor:
    entities:
      - sensor.internet_speed_in
      - sensor.internet_speed_out
      - sensor.wan_traffic_in_mean
      - sensor.wan_traffic_out_mean
  snmp_raw_values:
    entities:
      - sensor.snmp_wan_in
      - sensor.snmp_wan_out
