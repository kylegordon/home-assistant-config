---
automation:
  - alias: Study light toggle
    id: study_light_toggle
    mode: parallel
    # Can be improved, examples at https://github.com/TheFes/HA-configuration/blob/main/include/automation/01_first_floor/floris/shelly_floris.yaml
    triggers:
      - trigger: event
        event_type: esphome.tx_ultimate_easy
        event_data:
          device_name: study_lightswitch
          action: click
    actions:
      - action: light.turn_on
        target:
          entity_id: light.study_lightswitch_lights_all
        data:
          effect: "Rainbow - Fast"
      - action: switch.turn_on
        target:
          entity_id: switch.study_lightswitch_relay_1
      - choose:
          - conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity_id: light.study_lights
                    state: 'on'
                  - condition: state
                    entity_id: light.monitor_rgbww_lights
                    state: 'on'
            sequence:
              - action: light.turn_off
                target:
                  entity_id:
                    - light.study_lights
                    - light.monitor_rgbww_lights
        default:
          # Without an explicit level the bulbs resume whatever they last
          # stored, and the study Hue bulb has been stuck remembering 1/255.
          - action: light.turn_on
            target:
              entity_id:
                - light.study_lights
                - light.monitor_rgbww_lights
            data:
              brightness_pct: 100
      - action: logbook.log
        data:
          name: EVENT
          message: "Toggling study light"
      - delay: "00:00:05"
      - action: light.turn_off
        target:
          entity_id: light.study_lightswitch_lights_all
        data:
          transition: 1

  - alias: Study decorative light toggle
    id: study_decorative_toggle
    mode: parallel
    # Can be improved, examples at https://github.com/TheFes/HA-configuration/blob/main/include/automation/01_first_floor/floris/shelly_floris.yaml
    triggers:
      - trigger: event
        event_type: esphome.tx_ultimate_easy
        event_data:
          device_name: study_lightswitch
          action: double_click
    actions:
      - action: light.turn_on
        target:
          entity_id: light.study_lightswitch_lights_all
        data:
          effect: "Rainbow - Fast"
      - choose:
          - conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity_id: light.study_bead_lights_usb_switch_relay_3
                    state: 'on'
                  - condition: state
                    entity_id: light.monitor_rgbww_lights
                    state: 'on'
            sequence:
              - action: light.turn_off
                target:
                  entity_id:
                    - light.study_bead_lights_usb_switch_relay_3
                    - light.monitor_rgbww_lights
        default:
          - action: light.turn_on
            target:
              entity_id:
                - light.study_bead_lights_usb_switch_relay_3
                - light.monitor_rgbww_lights
      - action: logbook.log
        data:
          name: EVENT
          message: "Toggling decorative study lights"
      - delay: "00:00:05"
      - action: light.turn_off
        target:
          entity_id: light.study_lightswitch_lights_all
        data:
          transition: 1

  - alias: 'Increase brightness of lamp from dimmer'
    id: increase_brightness_of_lamp_from_dimmer
    initial_state: 'on'
    triggers:
      - trigger: mqtt
        topic: zigbee2mqtt/Study Wireless Dimmer Dial/action
        payload: 'brightness_move_up'
    actions:
      - action: light.turn_on
        target:
          entity_id: light.study
        data:
          transition: 1
          brightness_step_pct: 10

  - alias: 'Decrease brightness of lamp from dimmer'
    id: decrease_brightness_of_lamp_from_dimmer
    initial_state: 'on'
    triggers:
      - trigger: mqtt
        topic: zigbee2mqtt/Study Wireless Dimmer Dial/action
        payload: 'brightness_move_down'
    actions:
      - action: light.turn_on
        target:
          entity_id: light.study
        data:
          transition: 1
          brightness_step_pct: -10
