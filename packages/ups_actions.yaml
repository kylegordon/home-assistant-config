---
# sensor.apc1000_status_data is NUT's raw ups.status: space-separated flags
# such as "OL", "OL CHRG", "OB DISCHRG", "OB LB". Test for the flags rather
# than comparing the whole string.
automation:
  - alias: "UPS Not OK"
    id: ups_not_ok
    triggers:
      - trigger: template
        value_template: "{{ 'OB' in states('sensor.apc1000_status_data').split() }}"
    actions:
      - action: notify.mobile_app_nothing_phone_2
        data:
          title: 'Power failure - UPS responding'
          message: "UPS is on battery ({{ states('sensor.apc1000_status_data') }}). Runtime {{ states('sensor.apc1000_battery_runtime') }}s."
          data:
            # The companion app authenticates relative camera proxy URLs itself
            image: /api/camera_proxy/camera.driveway

  - alias: "UPS Shutdown Imminent"
    id: ups_shutdown_imminent
    triggers:
      - trigger: numeric_state
        entity_id: sensor.apc1000_battery_runtime
        below: 600
    actions:
      - action: notify.mobile_app_nothing_phone_2
        data:
          title: 'Power outage - UPS shutting down'
          message: "UPS runtime is down to {{ states('sensor.apc1000_battery_runtime') }}s."
          data:
            # The companion app authenticates relative camera proxy URLs itself
            image: /api/camera_proxy/camera.driveway

  - alias: "UPS Recovery"
    id: ups_recovery
    triggers:
      - trigger: state
        entity_id: sensor.apc1000_status_data
    conditions:
      # Only a real on-battery -> on-line transition, not NUT reconnecting
      # from unavailable
      - condition: template
        value_template: >
          {{ 'OB' in trigger.from_state.state.split()
             and 'OL' in trigger.to_state.state.split() }}
    actions:
      - action: notify.mobile_app_nothing_phone_2
        data:
          title: 'Power outage - UPS has recovered'
          message: "Mains power is back ({{ states('sensor.apc1000_status_data') }})."
          data:
            # The companion app authenticates relative camera proxy URLs itself
            image: /api/camera_proxy/camera.driveway
