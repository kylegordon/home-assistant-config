---
automation:
  - alias: Alarm sensor state change notification
    id: alarm_sensor_state_change_notification
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.back_door
          - binary_sensor.front_door
          - binary_sensor.patio_door
          - binary_sensor.ensuite_window
          - binary_sensor.master_bedroom_window
          - binary_sensor.guest_bedroom_window
          - binary_sensor.study_window
          - binary_sensor.craft_room_window
          - binary_sensor.bathroom_window
          - binary_sensor.dining_table_window
          - binary_sensor.kitchen_window
          - binary_sensor.utility_room_window
    actions:
      - action: media_player.volume_set
        target:
          entity_id: media_player.kitchen
        data:
          volume_level: >
            {% if states('sensor.time_of_day') == "Morning" %}
            0.5
            {% elif states('sensor.time_of_day') == "Day" %}
            0.5
            {% elif states('sensor.time_of_day') == "Night" %}
            0.2
            {% endif %}
      - action: notify.alexa_media
        data:
          target:
            - media_player.kitchen
          data:
            type: announce
            # method: all
          message: >-
            {% if trigger.to_state.state == 'on' %}
              {{ trigger.to_state.attributes.friendly_name }} has opened
            {% else %}
              {{ trigger.to_state.attributes.friendly_name }} has closed
            {% endif %}

  - alias: "Alarm Set Away"
    id: alarm_set_away
    triggers:
      - trigger: state
        entity_id: binary_sensor.home_occupied
        from: "on"
        to: "off"
        for:
          minutes: 5
    conditions:
      - condition: state
        entity_id: binary_sensor.guest_mode
        state: 'off'
    actions:
      - action: logbook.log
        data:
          name: EVENT
          message: "Away mode. Setting alarm."
      - action: alarm_control_panel.alarm_arm_away
        target:
          entity_id: alarm_control_panel.home_alarm
      - action: notify.mobile_app_nothing_phone_2
        continue_on_error: true
        data:
          title: "Alarm armed (away)"
          message: "Nobody is home. Alarm set to away."

  - alias: "Alarm Set Home"
    id: alarm_set_home
    triggers:
      - trigger: state
        entity_id: binary_sensor.home_occupied
        from: "off"
        to: "on"
    actions:
      - action: logbook.log
        data:
          name: EVENT
          message: "Home is occupied. Disarming alarm."
      # The manual alarm panel always validates the code on disarm, even
      # with code_arm_required: false
      - action: alarm_control_panel.alarm_disarm
        target:
          entity_id: alarm_control_panel.home_alarm
        data:
          code: !secret alarm_code
      - action: notify.mobile_app_nothing_phone_2
        continue_on_error: true
        data:
          title: "Alarm disarmed"
          message: "Home is occupied. Alarm disarmed."

  - alias: "Alarm Set Sleeping"
    id: alarm_set_sleeping
    triggers:
      - trigger: state
        entity_id: sensor.kyle_status
        to: "Sleeping"
      - trigger: state
        entity_id: sensor.charlotte_status
        to: "Sleeping"
    conditions:
      - condition: state
        entity_id: binary_sensor.guest_mode
        state: "off"
    actions:
      - action: logbook.log
        data:
          name: EVENT
          message: "Sleeping. Setting alarm."
      - action: script.alarm_home
