---
binary_sensor:
  - platform: group
    # Openings that should prevent the heating from coming on
    name: Climate Openings
    device_class: opening
    entities:
      # - binary_sensor.back_door
      # - binary_sensor.front_door
      # - binary_sensor.patio_door
      - binary_sensor.ensuite_window
      - binary_sensor.master_bedroom_window
      - binary_sensor.guest_bedroom_window
      - binary_sensor.study_window
      - binary_sensor.craft_room_window
      - binary_sensor.bathroom_window
      - binary_sensor.dining_table_window
      - binary_sensor.kitchen_window
      # - binary_sensor.utility_room_window

template:
  - binary_sensor:
      # Openings and occupancy are debounced by 5 minutes so a door or a
      # brief departure doesn't cycle the heat pump. The stove isn't: it
      # acts on the 100°C threshold straight away.
      - name: Heating Lockout Openings
        unique_id: heating_lockout_openings
        state: "{{ is_state('binary_sensor.climate_openings', 'on') }}"
        delay_on:
          minutes: 5
        delay_off:
          minutes: 5
      - name: Heating Lockout Away
        unique_id: heating_lockout_away
        state: "{{ is_state('binary_sensor.home_occupied', 'off') }}"
        delay_on:
          minutes: 5
        delay_off:
          minutes: 5
      # One place for every reason the heating should stay off, so the two
      # automations below can't disagree about it. An unavailable stove or
      # occupancy sensor doesn't count as a lockout, so a dead sensor can't
      # hold the heating off indefinitely.
      - name: Heating Lockout
        unique_id: heating_lockout
        icon: mdi:radiator-off
        state: >-
          {{ is_state('binary_sensor.heating_lockout_openings', 'on')
             or is_state('binary_sensor.heating_lockout_away', 'on')
             or states('sensor.hwam_smart_stove_temperature') | float(0) > 100 }}

automation:
  - alias: "Turn on ASHP"
    id: turnonashp
    description: >-
      Resume the ASHP schedule once every heating lockout has cleared
    triggers:
      # from: 'on' so a restart (unavailable -> off) doesn't cancel a
      # quick veto set by hand
      - trigger: state
        entity_id: binary_sensor.heating_lockout
        from: 'on'
        to: 'off'
    conditions:
      - condition: state
        entity_id: binary_sensor.heating_lockout
        state: 'off'
    actions:
      # During an Axle export event (axle_energy.yaml) the heat pump stays
      # off until the event ends. The lockout veto can run up to three hours,
      # so it is swapped for one that lapses with the event rather than left
      # to outlast it.
      - variables:
          end_time: "{{ state_attr('binary_sensor.axle_export_event', 'end_time') | as_datetime(none) }}"
          veto_hours: >
            {{ (((((end_time | as_datetime) - now()).total_seconds() / 3600 * 10) | round(0, 'ceil')) / 10)
               if is_state('binary_sensor.axle_export_event', 'on') and end_time else 0 }}
      - if:
          - condition: template
            value_template: "{{ veto_hours | float(0) > 0 }}"
        then:
          - action: mypyllant.set_quick_veto
            target:
              entity_id: climate.viewpoint_zone_1_circuit_0_climate
            data:
              temperature: 15
              duration_hours: "{{ veto_hours }}"
        else:
          - action: mypyllant.cancel_quick_veto
            target:
              entity_id: climate.viewpoint_zone_1_circuit_0_climate
          - delay: "00:00:02"
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.viewpoint_zone_1_circuit_0_climate
            data:
              hvac_mode: auto

  - alias: "Turn off ASHP"
    id: turnoffashp
    description: >-
      Hold the ASHP off with a quick veto while any heating lockout is
      active (window open, stove lit, or nobody home)
    triggers:
      - trigger: state
        entity_id: binary_sensor.heating_lockout
        to: 'on'
      # The quick veto lasts 3 hours. Refresh it hourly so a lockout that
      # outlasts it doesn't let the heating back on.
      - trigger: time_pattern
        minutes: 0
      # Catch a lockout that was already active when HA started
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: binary_sensor.heating_lockout
        state: 'on'
    actions:
      - action: mypyllant.set_quick_veto
        target:
          entity_id: climate.viewpoint_zone_1_circuit_0_climate
        data:
          temperature: 15
          duration_hours: 3

  - alias: Predbat error monitor
    id: predbat_error_monitor
    description: Alert when Predbat has raised an exception
    trace:
      stored_traces: 20
    triggers:
      - trigger: template
        alias: Predbat status contains 'Error' for 5 minutes
        value_template: "{{ 'Error' in states('predbat.status') }}"
        for:
          minutes: 5
        variables:
          alert_text: >-
            predbat status is {{ states('predbat.status') }}, error={{
            state_attr('predbat.status', 'error') }}
      - trigger: state
        alias: Predbat is in error status for 5 minutes
        entity_id: predbat.status
        attribute: error
        to: true
        for:
          minutes: 5
        variables:
          alert_text: >-
            predbat status is {{ states('predbat.status') }}, error={{
            state_attr('predbat.status', 'error') }}
      - trigger: state
        alias: Predbat status.last_updated has not changed for 20 minutes
        entity_id: predbat.status
        attribute: last_updated
        for:
          minutes: 20
        variables:
          alert_text: >-
            Predbat stalled? Restarting. last_updated=' {{
            state_attr('predbat.status','last_updated')|as_timestamp|timestamp_custom('%a
            %H:%M') }}', unchanged for 20 mins; Status='{{ states('predbat.status')
            }}'
          restart_predbat: "Y"
      - trigger: state
        entity_id: binary_sensor.predbat_running
        to: "off"
        for:
          minutes: 15
        variables:
          alert_text: Predbat add-on is not running
          restart_predbat: "Y"
    action:
      - service: notify.notify
        alias: Send alert message
        data:
          title: Predbat status issue
          message: |
            {{now().strftime('%-d %b %H:%M')}} ISSUE:
            {{ alert_text }}
          data:
            visibility: public
            persistent: true
            push:
              sound:
                name: default
                critical: 1
                volume: 0.8
            sticky: true
            color: red
    mode: single

  - alias: "Announce defrost cycle"
    id: announce_defrost_cycle
    description: >-
      Announce defrost cycle
    triggers:
      - trigger: state
        entity_id: sensor.s00_compressorstate
        to: "Defrost"
    action:
      - service: notify.alexa_media
        data:
          target:
            - media_player.kitchen
          data:
            type: announce
            # method: all
          message: >-
            "Heat pump has started a defrost cycle"
