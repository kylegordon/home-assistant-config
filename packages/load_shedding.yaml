---

# Load shedding: when Predbat's plan says the battery will hit its reserve
# before the next cheap import rate, shed the optional loads until that cheap
# rate starts.
#
# The shed loads read input_boolean.load_shed themselves:
#   - tin_hut_heating.yaml holds the Tin Hut thermostat off, warm and floor
#     guard alike, as it does for an Axle export event.
#   - dehumidifier.yaml turns the dehumidifier off and keeps it off.
#
# "Cheap" comes from Predbat's import rates (predbat.rates), not the clock:
# a slot is cheap if it is free (0p or less) or at the lowest non-free price
# in Predbat's rates. On the current two-rate tariff that is 23:30-05:30 at
# 7.62p, plus any Octopus free electricity session, which Predbat prices at
# 0p (apps.yaml octopus_free_session). Free sessions are left out of the
# lowest price so one doesn't stop the overnight rate counting as cheap.
# Saving and power-down sessions are priced high, so they count as peak.
#
# NOT FOR AGILE. This assumes a fixed tariff with one cheap price, where only
# a free session goes to 0p. On Agile (or any tariff with a different price
# each half hour) the lowest non-free price is a single half hour, so "cheap"
# would shrink to that one slot and the shed would run until it, often the
# next night. Plunge prices at or below 0p would also all count as cheap.
# Agile needs a different idea of cheap, such as Predbat's own low-rate
# threshold (predbat.rates attribute threshold) or a fixed p/kWh cut-off.
#
# "Short" is Predbat's executed plan (predbat.soc_kw_best, a 5-minute SoC
# forecast in kWh) reaching the battery reserve at any point between now and
# the next cheap slot. Predbat holds the battery at the reserve rather than
# going below it, so the plan touching the reserve is the plan draining the
# battery. The reserve is read from Predbat's own reserve percentage and
# battery size, not copied here.
#
# Once shed, the loads stay shed until the forecast has recovered with room
# to spare: short off for 30 minutes and the plan's lowest point at least
# 2 kWh above the reserve. The margin and the wait stop a forecast that
# improves because the loads are off from switching them straight back on.
# That release happens once per peak: a shed that starts again after it lasts
# until the next cheap slot, so the loads can't cycle on and off. Otherwise
# the shed ends when the next cheap slot starts. A free session during the day
# ends the shed, so the loads run on free power; when peak resumes the plan is
# checked again. Turn the helper off by hand to bring the loads back early; it
# sheds again if the forecast clears and goes short again, when peak next
# begins, or once a restart or a stalled Predbat has made the forecast
# unavailable and it comes back short. With no Predbat rates for an hour the
# shed ends, since nothing can say when the cheap slot comes; the
# forecast-missing alert says why nothing sheds then. A shed turned on by hand
# is never released early: it lasts until the next cheap slot starts, or
# until a restart during a cheap slot.

input_boolean:
  # No initial: so a shed survives a restart.
  load_shed:
    name: Load shed
    icon: mdi:transmission-tower-off
  # On while the current shed is one Load shed start made, the only kind
  # released early when the forecast recovers.
  load_shed_auto:
    name: Load shed automatic
    icon: mdi:transmission-tower-off

input_datetime:
  # When the current shed began, so a shed that outlived a cheap slot while
  # Home Assistant was down is cleared at start-up.
  load_shed_since:
    name: Load shed since
    has_date: true
    has_time: true
  # When a shed was last released early, so it happens once per peak; reset
  # to 1970 when a cheap slot starts.
  load_shed_released:
    name: Load shed released
    has_date: true
    has_time: true

template:
  # The lowest import price above 0p from the current slot onwards: the
  # normal cheap rate. Past days are left out so a tariff change counts at
  # once. Unknown unless a dearer price is also ahead, so a cut-short rate
  # timeline can't make the peak price count as cheap; that raises the
  # forecast-missing alert below. See the Agile note at the top.
  - sensor:
      - name: Import cheap rate
        unique_id: import_cheap_rate
        unit_of_measurement: p/kWh
        icon: mdi:cash-minus
        availability: "{{ state_attr('predbat.rates', 'results') is mapping }}"
        state: >
          {% set ns = namespace(cur=none, low=none, high=none) %}
          {% for t, v in state_attr('predbat.rates', 'results') | dictsort %}
            {% set d = as_datetime(t) %}
            {% set p = v | float(none) %}
            {% if d is not none and p is not none %}
              {% if d <= now() %}
                {% set ns.cur = p %}
              {% else %}
                {% if p > 0 and (ns.low is none or p < ns.low) %}{% set ns.low = p %}{% endif %}
                {% if ns.high is none or p > ns.high %}{% set ns.high = p %}{% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if ns.cur is not none %}
            {% if ns.cur > 0 and (ns.low is none or ns.cur < ns.low) %}{% set ns.low = ns.cur %}{% endif %}
            {% if ns.high is none or ns.cur > ns.high %}{% set ns.high = ns.cur %}{% endif %}
          {% endif %}
          {{ ns.low if ns.low is not none and ns.high > ns.low else none }}

  # Start of the cheap run now under way, or of the next one. predbat.rates
  # lists the times the price changes, so the price at any moment is that of
  # the latest entry at or before it. Unknown if no cheap slot is published,
  # or if no entry is later than now (a stale timeline), which raises the
  # forecast-missing alert below.
  - sensor:
      - name: Next cheap import
        unique_id: next_cheap_import
        device_class: timestamp
        availability: >
          {{ state_attr('predbat.rates', 'results') is mapping
             and has_value('sensor.import_cheap_rate') }}
        state: >
          {% set low = states('sensor.import_cheap_rate') | float(0) %}
          {% set ns = namespace(run=none, ans=none, passed=false) %}
          {# dictsort: the '+0000' keys sort in time order. #}
          {% for t, v in state_attr('predbat.rates', 'results') | dictsort %}
            {% set d = as_datetime(t) %}
            {% set p = v | float(none) %}
            {% if d is not none and p is not none %}
              {% set cheap = p <= 0 or p <= low %}
              {% if ns.ans is none and d > now() %}
                {% if not ns.passed %}
                  {% set ns.passed = true %}
                  {% if ns.run is not none %}{% set ns.ans = ns.run %}{% endif %}
                {% endif %}
                {% if ns.ans is none and cheap %}{% set ns.ans = d %}{% endif %}
              {% endif %}
              {% if cheap %}
                {% if ns.run is none %}{% set ns.run = d %}{% endif %}
              {% else %}
                {% set ns.run = none %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.ans.isoformat() if ns.ans is not none else none }}

  - binary_sensor:
      - name: Import rate cheap
        unique_id: import_rate_cheap
        icon: mdi:cash-clock
        availability: "{{ has_value('sensor.next_cheap_import') }}"
        state: >
          {% set n = as_datetime(states('sensor.next_cheap_import')) %}
          {{ n is not none and n <= now() }}

  # Unavailable without a plan, the reserve or the next cheap slot, or with a
  # plan over 30 minutes old (Predbat updates it every 5), which never sheds
  # anything. During a cheap slot there is nothing before it, so it reads off.
  - binary_sensor:
      - name: Battery short before cheap rate
        unique_id: battery_short_before_cheap_rate
        icon: mdi:battery-alert-variant-outline
        availability: >
          {{ state_attr('predbat.soc_kw_best', 'results') is mapping
             and now() - states.predbat.soc_kw_best.last_updated < timedelta(minutes=30)
             and has_value('number.predbat_givtcp_0_reserve')
             and has_value('sensor.predbat_givtcp_0_soc_max')
             and has_value('sensor.next_cheap_import') }}
        state: >
          {% set reserve = states('number.predbat_givtcp_0_reserve') | float
                           * states('sensor.predbat_givtcp_0_soc_max') | float / 100 %}
          {% set start = now() - timedelta(minutes=5) %}
          {% set end = as_datetime(states('sensor.next_cheap_import')) or now() %}
          {% set ns = namespace(low=none) %}
          {% for t, kwh in state_attr('predbat.soc_kw_best', 'results').items()
                 if as_datetime(t) is not none and start <= as_datetime(t) < end
                    and kwh | float(none) is not none %}
            {% if ns.low is none or kwh | float < ns.low %}
              {% set ns.low = kwh | float %}
            {% endif %}
          {% endfor %}
          {# No usable plan point before a cheap slot still to come (a changed
             key format, a short horizon) is unknown, which raises the
             forecast-missing alert, rather than a quiet "not short". #}
          {% if ns.low is none and end > now() %}
            {{ none }}
          {% else %}
            {# 0.05 kWh absorbs rounding in the plan's 3-decimal figures. #}
            {{ ns.low is not none and ns.low <= reserve + 0.05 }}
          {% endif %}
        # For the early release in Load shed end. low_kwh repeats the state's
        # loop (keep the two in step); none when there is no plan point.
        attributes:
          reserve_kwh: >
            {% set pct = states('number.predbat_givtcp_0_reserve') | float(none) %}
            {% set size = states('sensor.predbat_givtcp_0_soc_max') | float(none) %}
            {{ (pct * size / 100) | round(3) if pct is not none and size is not none else none }}
          low_kwh: >
            {% set start = now() - timedelta(minutes=5) %}
            {% set end = as_datetime(states('sensor.next_cheap_import')) or now() %}
            {% set ns = namespace(low=none) %}
            {% for t, kwh in (state_attr('predbat.soc_kw_best', 'results') or {}).items()
                   if as_datetime(t) is not none and start <= as_datetime(t) < end
                      and kwh | float(none) is not none %}
              {% if ns.low is none or kwh | float < ns.low %}
                {% set ns.low = kwh | float %}
              {% endif %}
            {% endfor %}
            {{ ns.low }}

  # The forecast above missing outside a cheap slot, so nothing can shed. The
  # Predbat error monitor in climate.yaml misses a Predbat that never posts
  # after a restart: its triggers need predbat.status to change. The 45
  # minutes count from start-up for a sensor unavailable since boot.
  - binary_sensor:
      - name: Load shed forecast missing
        unique_id: load_shed_forecast_missing
        device_class: problem
        delay_on:
          minutes: 45
        state: >
          {{ states('binary_sensor.battery_short_before_cheap_rate') not in ['on', 'off']
             and not is_state('binary_sensor.import_rate_cheap', 'on') }}

alert:
  load_shed_forecast_missing:
    name: Load shed forecast missing
    entity_id: binary_sensor.load_shed_forecast_missing
    state: "on"
    repeat:
      - 240
    can_acknowledge: true
    skip_first: false
    title: Load shed
    message: >
      There has been no usable Predbat plan or rate for at least 45 minutes, so
      load shedding can't run. Check Predbat.
    done_message: Load shedding has a current Predbat plan again.
    notifiers:
      - mobile_app_nothing_phone_2
      - persistent_notification
    data:
      tag: load_shed_forecast_missing
      timeout: 14400
      notification_id: load_shed_forecast_missing

automation:
  - alias: Load shed start
    id: load_shed_start
    description: Shed optional loads when Predbat's plan drains the battery before the next cheap rate.
    mode: single
    triggers:
      # 10 minutes rides out a single odd Predbat recalculation. During a
      # cheap slot the short sensor reads off, so it turns on as peak begins.
      - trigger: state
        entity_id: binary_sensor.battery_short_before_cheap_rate
        to: "on"
        for:
          minutes: 10
    conditions:
      - condition: state
        entity_id: binary_sensor.import_rate_cheap
        state: "off"
      - condition: state
        entity_id: binary_sensor.battery_short_before_cheap_rate
        state: "on"
        for:
          minutes: 10
      - condition: state
        entity_id: input_boolean.load_shed
        state: "off"
    actions:
      # Before load_shed, so the shed is marked automatic from its start.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.load_shed_auto
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.load_shed
      - action: notify.mobile_app_nothing_phone_2
        data:
          title: Load shed
          message: >
            {% set n = as_datetime(states('sensor.next_cheap_import')) %}
            Predbat's plan runs the battery down to its reserve before the next
            cheap rate{{ ' at ' ~ (n | as_local).strftime('%H:%M') if n is not none else '' }},
            so the Tin Hut heating and the dehumidifier are off until the
            forecast recovers, or until then at the latest.
          data:
            tag: load_shed

  - alias: Load shed end
    id: load_shed_end
    description: >-
      Bring the shed loads back when the next cheap rate starts, or once an
      automatic shed's forecast has recovered.
    # The 5-minute poll runs often; keep enough to see a release.
    trace:
      stored_traces: 30
    triggers:
      - trigger: state
        entity_id: binary_sensor.import_rate_cheap
        to: "on"
      # Catches a cheap slot missed while Home Assistant was down. Predbat's
      # entities aren't restored, so the rates may only arrive after start-up:
      # check again once they do.
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: binary_sensor.import_rate_cheap
        from:
          - unavailable
          - unknown
        to: "off"
      # Polled for missing rates (no state trigger with for: sees a sensor
      # unavailable from boot; last_changed counts from boot then) and for the
      # early release (a for: trigger fires once, missing a margin that only
      # grows enough later).
      - trigger: time_pattern
        minutes: "/5"
        id: poll
    variables:
      since: "{{ state_attr('input_datetime.load_shed_since', 'timestamp') | float(0) }}"
      released: "{{ state_attr('input_datetime.load_shed_released', 'timestamp') | float(0) }}"
      # Cheap run starts in Predbat's rates up to now. Only a cheap price after
      # a dearer one counts as a run beginning: predbat.rates repeats some
      # prices mid-run.
      runs: >
        {% set ns = namespace(starts=[], prev=false) %}
        {% if has_value('sensor.import_cheap_rate') %}
          {% set low = states('sensor.import_cheap_rate') | float(0) %}
          {% for t, v in (state_attr('predbat.rates', 'results') or {}) | dictsort %}
            {% set d = as_timestamp(t, none) %}
            {% set p = v | float(none) %}
            {% if d is not none and p is not none %}
              {% set cheap = p <= 0 or p <= low %}
              {% if cheap and not ns.prev and d <= now().timestamp() %}
                {% set ns.starts = ns.starts + [d] %}
              {% endif %}
              {% set ns.prev = cheap %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.starts }}
      # A cheap run has begun since the shed began, one Home Assistant was down
      # for; or no shed start time, or one over 24 hours old (the rates may no
      # longer reach back to it).
      missed: >
        {{ runs | select('gt', since) | list | count > 0
           or since <= 0 or now().timestamp() - since > 86400 }}
      no_rates: >
        {% set c = states.binary_sensor.import_rate_cheap %}
        {{ c is none
           or (c.state not in ['on', 'off'] and now() - c.last_changed > timedelta(hours=1)) }}
      # An automatic shed whose forecast has been clear for 30 minutes with the
      # plan's lowest point 2 kWh above the reserve, and no early release yet
      # this peak (none since a cheap slot started, or one over 24 hours ago,
      # for a cheap start missed while Home Assistant was down). A time within
      # a day of 1970 is the reset value, or never set.
      release: >
        {% set s = states.binary_sensor.battery_short_before_cheap_rate %}
        {% set low = state_attr('binary_sensor.battery_short_before_cheap_rate', 'low_kwh') | float(none) %}
        {% set reserve = state_attr('binary_sensor.battery_short_before_cheap_rate', 'reserve_kwh') | float(none) %}
        {{ is_state('input_boolean.load_shed_auto', 'on')
           and is_state('binary_sensor.import_rate_cheap', 'off')
           and s is not none and s.state == 'off'
           and now() - s.last_changed >= timedelta(minutes=30)
           and low is not none and reserve is not none and low >= reserve + 2
           and (released <= 86400 or now().timestamp() - released > 86400) }}
    conditions:
      - condition: state
        entity_id: input_boolean.load_shed
        state: "on"
      # The poll acts only on missing rates and the early release.
      - condition: template
        value_template: >
          {% if trigger.id == 'poll' %}
            {{ no_rates or release }}
          {% else %}
            {{ no_rates or release
               or is_state('binary_sensor.import_rate_cheap', 'on') or missed }}
          {% endif %}
    actions:
      - if:
          - condition: template
            value_template: >
              {{ release and not no_rates and not missed
                 and not is_state('binary_sensor.import_rate_cheap', 'on') }}
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.load_shed_released
            data:
              timestamp: "{{ now().timestamp() }}"
          # Its own tag: the clear notification below removes the load_shed one.
          - action: notify.mobile_app_nothing_phone_2
            data:
              title: Load shed over
              message: >
                Predbat's plan now keeps the battery
                {{ (state_attr('binary_sensor.battery_short_before_cheap_rate', 'low_kwh') | float(0)
                    - state_attr('binary_sensor.battery_short_before_cheap_rate', 'reserve_kwh') | float(0))
                   | round(1) }} kWh above its reserve, so the Tin Hut heating and the
                dehumidifier are back on. Another shed today lasts until the cheap rate.
              data:
                tag: load_shed_released
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.load_shed

  # Any shed, by hand too, so the start-up check can tell whether a cheap slot
  # has started since.
  - alias: Load shed record start
    id: load_shed_record_start
    triggers:
      - trigger: state
        entity_id: input_boolean.load_shed
        from: "off"
        to: "on"
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.load_shed_since
        data:
          timestamp: "{{ now().timestamp() }}"

  # Any shed ending, so a later hand-set shed isn't taken for an automatic one.
  # Start-up covers a restart between Load shed start's two turn_ons.
  - alias: Load shed record end
    id: load_shed_record_end
    triggers:
      - trigger: state
        entity_id: input_boolean.load_shed
        from: "on"
        to: "off"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.load_shed
        state: "off"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.load_shed_auto

  # A new peak may release a shed early again.
  - alias: Load shed release reset
    id: load_shed_release_reset
    triggers:
      - trigger: state
        entity_id: binary_sensor.import_rate_cheap
        to: "on"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: binary_sensor.import_rate_cheap
        state: "on"
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.load_shed_released
        data:
          datetime: "1970-01-02 00:00:00"

  - alias: Load shed clear notification
    id: load_shed_clear_notification
    triggers:
      - trigger: state
        entity_id: input_boolean.load_shed
        from: "on"
        to: "off"
    actions:
      - action: notify.mobile_app_nothing_phone_2
        data:
          message: clear_notification
          data:
            tag: load_shed
