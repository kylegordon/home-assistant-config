---
# Dehumidifier: off overnight (noise) and during a load shed
# (load_shedding.yaml); during the day it runs while the house is humid.
#
# "Humid" is binary_sensor.house_humid: on once sensor.house_average_humidity
# (sensors.yaml) rises above input_number.dehumidifier_humidity_threshold
# (set to 60%, the old fixed value), off once it falls 5% below that, and
# unchanged in between. The unit's own humidity sensor reads far too low (about 30% in
# a 70% house), so its normal mode idles with only the fan running. Laundry
# mode runs the compressor whatever that sensor says, so Home Assistant does
# the switching instead.
#
# While the house average is unavailable, or 3 or more of its sensors are
# missing (the median of the few left isn't the house), "humid" keeps its last
# value, so the dehumidifier carries on as it was (still off overnight) and a
# short dropout, such as a restart, doesn't switch it. The alert below
# (phone and persistent notification, repeated daily) says when the average
# is unavailable or 3 or more of its sensors are missing.
input_number:
  # The house average humidity the dehumidifier turns on above; it turns off
  # 5% below. No initial: so a value set by hand survives a restart; a new
  # install starts at the 50% minimum, so set it once (60% was the old fixed
  # value). The template below falls back to 60% if the helper is missing.
  dehumidifier_humidity_threshold:
    name: Dehumidifier humidity threshold
    icon: mdi:water-percent
    min: 50
    max: 80
    step: 1
    unit_of_measurement: "%"

template:
  # Trigger-based so the state survives a restart; a Threshold integration
  # helper forgets which side of the band it was on.
  - trigger:
      - trigger: state
        entity_id:
          - sensor.house_average_humidity
          - sensor.house_humidity_sensors_missing
          # A new threshold applies straight away.
          - input_number.dehumidifier_humidity_threshold
      - trigger: homeassistant
        event: start
    binary_sensor:
      - name: House humid
        unique_id: house_humid
        state: >
          {% set h = states('sensor.house_average_humidity') | float(none) %}
          {% set was = is_state('binary_sensor.house_humid', 'on') %}
          {% set missing = states('sensor.house_humidity_sensors_missing') | int(99) %}
          {% set on_above = states('input_number.dehumidifier_humidity_threshold') | float(60) %}
          {{ was if h is none or missing >= 3 else h > on_above or (h >= on_above - 5 and was) }}
  - sensor:
      # Members of House Average Humidity (sensors.yaml) that are unavailable,
      # deleted, or have reported nothing for 6 hours (a stuck sensor keeps its
      # last value rather than going unavailable). Keep the list in step with
      # sensors.yaml.
      - name: House humidity sensors missing
        unique_id: house_humidity_sensors_missing
        state_class: measurement
        state: >
          {% set members = [
            'sensor.front_hall_lywsd03mmc_humidity',
            'sensor.craft_room_multi_sensor_humidity',
            'sensor.guest_room_multi_sensor_humidity',
            'sensor.living_room_multi_sensor_humidity',
            'sensor.master_bedroom_multi_sensor_humidity',
            'sensor.nook_multi_sensor_humidity',
            'sensor.hallway_multi_sensor_humidity',
            'sensor.study_multi_sensor_humidity',
            'sensor.study_lywsd03mmc_humidity',
            'sensor.bathroom_multi_sensor_humidity',
            'sensor.ensuite_lywsd03mmc_humidity'] %}
          {% set cutoff = now() - timedelta(hours=6) %}
          {{ members | count - (expand(members)
             | rejectattr('state', 'in', ['unavailable', 'unknown'])
             | selectattr('last_reported', 'gt', cutoff)
             | list | count) }}
  - binary_sensor:
      - name: House humidity average unreliable
        unique_id: house_humidity_average_unreliable
        device_class: problem
        delay_on: "00:10:00"
        state: >
          {{ not has_value('sensor.house_average_humidity')
             or not has_value('sensor.house_humidity_sensors_missing')
             or states('sensor.house_humidity_sensors_missing') | int(0) >= 3 }}

alert:
  house_humidity_average_unreliable:
    name: House humidity average unreliable
    entity_id: binary_sensor.house_humidity_average_unreliable
    state: "on"
    repeat:
      - 1440
    can_acknowledge: true
    skip_first: false
    title: House humidity
    message: >
      {{ states('sensor.house_humidity_sensors_missing') }} of the house
      humidity sensors are missing, or the house average is unavailable. The
      dehumidifier follows this average.
    done_message: The house humidity average is reliable again.
    notifiers:
      - mobile_app_nothing_phone_2
      - persistent_notification
    data:
      tag: house_humidity_average_unreliable
      timeout: 14400
      notification_id: house_humidity_average_unreliable

script:
  dehumidifier_run:
    alias: Dehumidifier run
    sequence:
      - action: humidifier.turn_on
        target:
          entity_id: humidifier.dehumidifier
      - action: humidifier.set_mode
        target:
          entity_id: humidifier.dehumidifier
        data:
          mode: laundry

automation:
  - alias: Dehumidifier off at night
    id: dehumidifier_off_at_night
    triggers:
      - trigger: time
        at: "21:00:00"
    actions:
      - action: humidifier.turn_off
        target:
          entity_id: humidifier.dehumidifier

  - alias: Dehumidifier on in the morning
    id: dehumidifier_on_in_the_morning
    triggers:
      - trigger: time
        at: "09:00:00"
    conditions:
      - condition: state
        entity_id: input_boolean.load_shed
        state: "off"
      - condition: state
        entity_id: binary_sensor.house_humid
        state: "on"
    actions:
      - action: script.dehumidifier_run

  - alias: Dehumidifier follows house humidity
    id: dehumidifier_follows_house_humidity
    # Queued so a quick humid/dry flip during a slow device call isn't dropped.
    mode: queued
    triggers:
      - trigger: state
        entity_id: binary_sensor.house_humid
        to: "on"
        id: humid
      - trigger: state
        entity_id: binary_sensor.house_humid
        to: "off"
        id: dry
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: humid
              - condition: state
                entity_id: input_boolean.load_shed
                state: "off"
              - condition: time
                after: "09:00:00"
                before: "21:00:00"
            sequence:
              - action: script.dehumidifier_run
          - conditions:
              - condition: trigger
                id: dry
            sequence:
              - action: humidifier.turn_off
                target:
                  entity_id: humidifier.dehumidifier

  - alias: Dehumidifier load shed
    id: dehumidifier_load_shed
    description: Keep the dehumidifier off during a load shed and overnight, and turn it back on if the shed ends during the day with the house humid.
    # Queued so a shed change during the start-up delay isn't dropped.
    mode: queued
    # The 5-minute recheck runs often; keep enough to see a start or restore.
    trace:
      stored_traces: 30
    triggers:
      - trigger: state
        entity_id: input_boolean.load_shed
        from: "off"
        to: "on"
        id: shed
      - trigger: state
        entity_id: input_boolean.load_shed
        from: "on"
        to: "off"
        id: restore
      # Turned on during a shed, by hand or once it reconnects.
      - trigger: state
        entity_id: humidifier.dehumidifier
        to: "on"
        id: shed
      # A shed and an on dehumidifier both restored at start-up change
      # nothing, so neither trigger above fires.
      - trigger: homeassistant
        event: start
        id: start
      # Catches a turn_off that failed with the dehumidifier still on, which
      # no state trigger above would see.
      - trigger: time_pattern
        minutes: "/5"
        id: shed
    actions:
      # Device-backed entities need a moment to reconnect after a restart.
      - if:
          - condition: trigger
            id: start
        then:
          - delay: "00:01:00"
      - choose:
          - conditions:
              - condition: trigger
                id:
                  - shed
                  - start
              # Overnight as well as during a shed: in laundry mode a missed
              # 21:00 turn-off (unit offline, Home Assistant down) would
              # otherwise run the compressor all night. This also turns off
              # a unit switched on by hand overnight.
              - condition: or
                conditions:
                  - condition: state
                    entity_id: input_boolean.load_shed
                    state: "on"
                  - condition: time
                    after: "21:00:00"
                    before: "09:00:00"
              - condition: state
                entity_id: humidifier.dehumidifier
                state: "on"
            sequence:
              - action: humidifier.turn_off
                target:
                  entity_id: humidifier.dehumidifier
          # A shed ending in the day (by hand, a free session, or Predbat's
          # rates going missing) turns it back on; the overnight cheap rate
          # ending a shed leaves it off for the night. A daytime start-up does
          # too, covering a shed that ended or a 09:00 missed while Home
          # Assistant was down; like 09:00, it overrides a hand-set off.
          - conditions:
              - condition: trigger
                id:
                  - restore
                  - start
              # A queued run can outlast its shed ending: check it still has.
              - condition: state
                entity_id: input_boolean.load_shed
                state: "off"
              - condition: time
                after: "09:00:00"
                before: "21:00:00"
              - condition: state
                entity_id: binary_sensor.house_humid
                state: "on"
            sequence:
              - action: script.dehumidifier_run
