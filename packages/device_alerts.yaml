---
automation:
  - alias: Alert when a critical device goes offline
    id: alert_when_a_critical_device_goes_offline
    trigger:
      - platform: state
        entity_id:
          - sensor.kitchen_temperature
          - binary_sensor.front_hall_sensor_status
          - sensor.garage_temperature
          - binary_sensor.hallway_bathroom_occupancy
          - binary_sensor.hallway_rooms_occupancy
          - binary_sensor.ensuite_motion_occupancy
          - binary_sensor.living_room_motion_occupancy
          - binary_sensor.kitchen_motion_occupancy
          - binary_sensor.front_hall_motion_occupancy
          - binary_sensor.front_door_motion
          - binary_sensor.washing_machine_power_plug_status
          - binary_sensor.dishwasher_power_plug_status
          - binary_sensor.workbench_lights_power_plug_status
          - binary_sensor.hot_tap_power_plug_status
          - binary_sensor.tv_power_plug_status
          - binary_sensor.craft_room_window
          - binary_sensor.ensuite_window_vibration
          - binary_sensor.ensuite_window_opening_contact
          - binary_sensor.guest_bedroom_window
          - binary_sensor.master_bedroom_window
          - binary_sensor.study_window
          - binary_sensor.garden_door
          - binary_sensor.boot_room_motion_occupancy
          - binary_sensor.boot_room_door
          - binary_sensor.bathroom_window
          - binary_sensor.dining_table_window
          - binary_sensor.kitchen_window
          - binary_sensor.patio_door
          - light.ensuite_entrance
          - light.ensuite_towels
          - light.ensuite_shower
          - light.ensuite_space
          - light.ensuite_toilet
          - light.ensuite_sink
          - switch.guest_bedroom_lightswitch_relay
          - switch.master_bedroom_lightswitch_relay
          - switch.study_lightswitch_relay
          - switch.craft_room_lightswitch_relay
          - light.driveway_floodlights
          - light.front_door_floodlights
          - light.garage_lights
          - light.study_light
          - light.guest_bedroom
          - light.master_bedroom
          - light.craft_room
          - light.hallway_bedrooms
          - light.hallway_bathroom
          - light.kitchen_cabinets
          - light.kitchen
          - light.boot_room
          - sensor.craft_room_multi_sensor_battery_level
          - sensor.guest_bedroom_multi_sensor_battery_level
          - sensor.living_room_multi_sensor_battery_level
          - sensor.master_bedroom_multi_sensor_battery_level
          - sensor.study_multi_sensor_battery_level
          - sensor.hallway_multi_sensor_battery_level
          - sensor.dining_nook_multi_sensor_battery_level
          - sensor.bathroom_multi_sensor_battery_level
        to: 'unavailable'
        for:
          minutes: 2
    condition:
      condition: and
      conditions:
        - condition: template
          value_template: >
            {% if states.automation.alert_when_a_critical_device_goes_offline.last_triggered is not none %}
              {% if as_timestamp(now()) | int   -  as_timestamp(states.automation.alert_when_a_critical_device_goes_offline.attributes.last_triggered) | int > 3600 %} true {% else %} false
              {% endif %}
            {% else %}
            false
            {% endif %}
    action:
      # continue_on_error so a push delivery failure doesn't stop the
      # persistent_notification below, the guaranteed-to-work fallback.
      - action: notify.mobile_app_nothing_phone_2
        continue_on_error: true
        data:
          message: '{{trigger.to_state.attributes.friendly_name}} has gone offline. Please check the status of this device as some features may stop functioning.'
          title: Device Alert
      - action: persistent_notification.create
        data:
          message: '{{trigger.to_state.attributes.friendly_name}} has gone offline. Please check the status of this device as some features may stop functioning.'
          title: Device Alert

  # An Everything Presence Lite's LD2450 radar can wedge: the ESP stays online
  # but the radar sends no frames, so occupancy and targets sit at `unknown`
  # after the next API reconnect. Only a power cycle at the wall clears it (the
  # "Reboot mmWave Sensor" button does not). A healthy unit publishes occupancy
  # within seconds of connecting, so 15 minutes of `unknown` is a wedge.
  # The start and reload triggers re-check after anything that drops a pending
  # `for:` or arms the state trigger only after a unit was already `unknown` (an HA
  # start, or the git pull + reload deploy). Keep the entity list in `radars` in
  # step with the state trigger.
  - alias: Presence radar stuck
    id: presence_radar_stuck
    mode: parallel
    variables:
      radars:
        - binary_sensor.presence_lite_kitchen_occupancy
        - binary_sensor.presence_lite_living_room_occupancy
        - binary_sensor.presence_lite_tin_hut_occupancy
    trigger:
      - platform: state
        id: stuck
        entity_id:
          - binary_sensor.presence_lite_kitchen_occupancy
          - binary_sensor.presence_lite_living_room_occupancy
          - binary_sensor.presence_lite_tin_hut_occupancy
        to: 'unknown'
        for:
          minutes: 15
      - platform: homeassistant
        id: recheck
        event: start
      - platform: event
        id: recheck
        event_type: automation_reloaded
    action:
      - if:
          - condition: trigger
            id: recheck
        then:
          - delay:
              minutes: 15
      - variables:
          stuck: "{{ [trigger.entity_id] if trigger.id == 'stuck' else radars | select('is_state', 'unknown') | list }}"
      - repeat:
          for_each: '{{ stuck }}'
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: 'presence_radar_stuck_{{ repeat.item }}'
                title: Presence radar stuck
                message: '{{ state_attr(repeat.item, ''friendly_name'') or repeat.item }} has reported nothing for 15 minutes. Power cycle the sensor at the wall.'
            # continue_on_error so one failed push doesn't skip the other radars.
            - action: notify.mobile_app_nothing_phone_2
              continue_on_error: true
              data:
                title: Presence radar stuck
                message: '{{ state_attr(repeat.item, ''friendly_name'') or repeat.item }} has reported nothing for 15 minutes. Power cycle the sensor at the wall.'
                data:
                  tag: 'presence_radar_stuck_{{ repeat.item }}'
