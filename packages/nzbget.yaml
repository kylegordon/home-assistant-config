---
automation:
  - alias: Completed Download
    id: completed_download
    triggers:
      - trigger: event
        event_type: nzbget_download_complete
        event_data:
          category: tv
    actions:
      - action: notify.mobile_app_nothing_phone_2
        continue_on_error: true
        data:
          title: "Download completed!"
          message: "{{ trigger.event.data.name }}"
      - action: system_log.write
        data:
          message: "{{ trigger.event.data.name }}"
          level: info

  - alias: Completed Star Trek Download
    id: completed_star_trek_download
    triggers:
      - trigger: event
        event_type: nzbget_download_complete
        event_data:
          category: tv
    conditions:
      - condition: template
        value_template: '{{ trigger.event.data.name is search("star.trek", ignorecase=True) }}'
    actions:
      - action: notify.mobile_app_nothing_phone_2
        data:
          title: "Star Trek download completed!"
          message: "{{ trigger.event.data.name }} has finished downloading"

  - alias: Completed Westworld Download
    id: completed_westworld_download
    triggers:
      - trigger: event
        event_type: nzbget_download_complete
        event_data:
          category: tv
    conditions:
      - condition: template
        value_template: '{{ trigger.event.data.name is search("westworld", ignorecase=True) }}'
    actions:
      - action: notify.mobile_app_nothing_phone_2
        continue_on_error: true
        data:
          title: "Westworld download completed!"
          message: "{{ trigger.event.data.name }} has finished downloading"
      - action: notify.alexa_media
        data:
          target:
            - media_player.living_room
          data:
            type: announce
            # method: all
          message: "Hello! You have a new show to watch. Westworld has finished downloading!"  # yamllint disable-line rule:line-length
