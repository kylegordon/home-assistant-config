---
reset_ikea:
  alias: reset_ikea
  description: >-
    Factory-reset IKEA Zigbee lights by power-cycling the relay that feeds them.
    Hallway Bedrooms is on switch.hall_single_lightswitch_relay_1, Hallway
    Bathroom on switch.hall_dual_lightswitch_relay_1.
  fields:
    relay:
      name: Relay
      description: Relay switch that powers the lights to reset.
      default: switch.hall_single_lightswitch_relay_1
      selector:
        entity:
          domain: switch
  # Field defaults only prefill the UI; this applies the default when the
  # script is called without a relay. A passed-in relay takes precedence.
  variables:
    relay: "{{ relay | default('switch.hall_single_lightswitch_relay_1', true) }}"
  sequence:
    - service: switch.turn_off
      target:
        entity_id: "{{ relay }}"
    - delay:
        hours: 0
        minutes: 0
        seconds: 5
        milliseconds: 0
    - repeat:
        count: '5'
        sequence:
          - service: switch.turn_on
            target:
              entity_id: "{{ relay }}"
          - delay:
              hours: 0
              minutes: 0
              seconds: 0
              milliseconds: 400
          - service: switch.turn_off
            target:
              entity_id: "{{ relay }}"
          - delay:
              hours: 0
              minutes: 0
              seconds: 1
              milliseconds: 500
    - service: switch.turn_on
      target:
        entity_id: "{{ relay }}"
  mode: single
